version: '3.8'

services:
  quanv1:
    build:
      context: .
      dockerfile: Dockerfile
    image: nato1000/quanv1:latest
    container_name: quanv1-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Persist cluster links data
      - cluster-data:/app/data
    networks:
      - quanv1-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  cluster-data:
    driver: local

networks:
  quanv1-network:
    driver: bridge
